<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .block {
            width: 600px;
            height: 400px;
            border: 2px solid green;
            margin: auto;
            position: relative;
            left: 50px;
            margin-top: 50px;
        }
        .item-1 {
            border: 2px solid rgb(59, 120, 161);
            width: 50px;
            height: 50px;
            position: absolute;
            left: 0;
            top: 0;
        }
    </style>
</head>
<body>
    <div class="block">
        <div class="item-1"></div>
        <div class="item-2"></div>
    </div>
</body>
</html>
